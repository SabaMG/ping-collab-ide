# Demo deployment (Dokploy): web serves the React build and proxies /api
# to the Quarkus backend; postgres is seeded from ping.sql on first boot.
services:
  db:
    image: postgres:17-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment:
      POSTGRES_DB: ping
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pingdata:/var/lib/postgresql/data
      - ./backend/ping.sql:/docker-entrypoint-initdb.d/ping.sql:ro
  backend:
    build: ./backend
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/ping
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DEVSERVICES_ENABLED: "false"
      QUARKUS_HTTP_CORS: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
  web:
    build: ./frontend
    depends_on:
      - backend
    # For local testing, expose with: ports: ["8088:80"].
    # On Dokploy, leave unpublished — Traefik routes to container port 80
    # via the domain attached to this service.
volumes:
  pingdata:
